services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disclosure}
      POSTGRES_USER: ${POSTGRES_USER:-disclosure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disclosure} -d ${POSTGRES_DB:-disclosure}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - disclosure_postgres_data:/var/lib/postgresql/data

volumes:
  disclosure_postgres_data:
